# Default parameter values when submitting via:
#
#   deadline bundle submit test/integ/submitter_e2e/job
#
# But the typical entrypoint is `python submit.py` from the parent directory,
# which embeds run_test.py / driver.py into the template at submission time.
parameterValues:
- name: SourceMode
  value: github
- name: GitRepo
  value: https://github.com/aws-deadline/deadline-cloud-for-cinema-4d.git
- name: GitRef
  value: mainline
# Queue-env parameter overrides: install the cinema4d package from the
# deadline-cloud channel before our step runs.
- name: CondaPackages
  value: cinema4d=2026.*
- name: CondaChannels
  value: deadline-cloud
